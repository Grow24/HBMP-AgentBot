# HBMP AgentBot — standalone stack (this app is its own site on port 3080).
# Copy the HBMP_AgentBot folder, then:
#   cp .env.example .env && cp librechat.yaml.example librechat.yaml
#   # edit .env (API keys, DOMAIN_CLIENT / DOMAIN_SERVER, secrets)
#   docker compose up -d --build
#
# Optional file search / RAG:
#   docker compose --profile rag up -d --build

services:
  api:
    container_name: hbmp-agentbot
    build:
      context: .
      dockerfile: Dockerfile
    image: hbmp-agentbot:standalone
    ports:
      - "${PORT:-3080}:3080"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - NODE_ENV=production
      - AGENTBOT_BASE=/
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_API_URL=${RAG_API_URL:-http://rag_api:8000}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - agentbot_images:/app/client/public/images
      - agentbot_uploads:/app/uploads
      - agentbot_logs:/app/logs

  mongodb:
    container_name: hbmp-agentbot-mongodb
    image: mongo:7
    restart: always
    volumes:
      - agentbot_mongo:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: hbmp-agentbot-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKeyChangeMe}
    volumes:
      - agentbot_meili:/meili_data

  vectordb:
    container_name: hbmp-agentbot-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    profiles: ["rag"]
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - agentbot_pg:/var/lib/postgresql/data

  rag_api:
    container_name: hbmp-agentbot-rag
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    profiles: ["rag"]
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  agentbot_mongo:
  agentbot_meili:
  agentbot_images:
  agentbot_uploads:
  agentbot_logs:
  agentbot_pg:
