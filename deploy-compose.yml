# HBMP AgentBot — production-style compose (local image + nginx on :80)
# Prefer `docker compose up -d --build` from docker-compose.yml for most servers.
# Use this file when you want nginx in front of the API:
#   docker compose -f deploy-compose.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hbmp-agentbot:standalone
    container_name: hbmp-agentbot-api
    expose:
      - "3080"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - AGENTBOT_BASE=/
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - agentbot_images:/app/client/public/images
      - agentbot_uploads:/app/uploads
      - agentbot_logs:/app/api/logs

  client:
    image: nginx:1.27.0-alpine
    container_name: hbmp-agentbot-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mongodb:
    container_name: hbmp-agentbot-mongodb
    image: mongo:7
    restart: always
    volumes:
      - agentbot_mongo:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: hbmp-agentbot-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - agentbot_meili:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    profiles: ["rag"]
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - agentbot_pg:/var/lib/postgresql/data

  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    profiles: ["rag"]
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  agentbot_mongo:
  agentbot_meili:
  agentbot_images:
  agentbot_uploads:
  agentbot_logs:
  agentbot_pg:
